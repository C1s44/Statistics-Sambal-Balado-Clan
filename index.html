<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Informasi Klan Clash of Clans</title>
  <style>
    /* CSS Sederhana & Responsive */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Header Klan */
    .clan-header {
      background-color: #1e293b;
      border-radius: 12px;
      padding: 24px;
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 30px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    .clan-badge {
      width: 100px;
      height: 100px;
    }

    .clan-info h1 {
      color: #f59e0b;
      font-size: 2rem;
      margin-bottom: 5px;
    }

    .clan-meta {
      color: #94a3b8;
      font-size: 0.9rem;
      margin-bottom: 10px;
    }

    .clan-description {
      font-style: italic;
      color: #cbd5e1;
      font-size: 0.95rem;
    }

    /* Section Anggota */
    .section-title {
      font-size: 1.5rem;
      margin-bottom: 15px;
      color: #38bdf8;
      border-bottom: 2px solid #334155;
      padding-bottom: 8px;
    }

    .member-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }

    /* Card Anggota */
    .member-card {
      background-color: #1e293b;
      border-radius: 8px;
      padding: 16px;
      border-left: 4px solid #3b82f6;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .member-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
    }

    .member-card.leader {
      border-left-color: #ef4444; /* Warna merah untuk Leader */
    }

    .member-card.coLeader {
      border-left-color: #f59e0b; /* Warna kuning untuk Co-Leader */
    }

    .member-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .member-name {
      font-weight: bold;
      font-size: 1.1rem;
      color: #ffffff;
    }

    .member-rank {
      background-color: #334155;
      color: #94a3b8;
      font-size: 0.8rem;
      padding: 2px 8px;
      border-radius: 12px;
    }

    .member-role {
      font-size: 0.85rem;
      color: #38bdf8;
      text-transform: capitalize;
      margin-bottom: 8px;
    }

    .member-details {
      font-size: 0.9rem;
      color: #cbd5e1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .donations {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed #334155;
      font-size: 0.8rem;
      color: #94a3b8;
      display: flex;
      justify-content: space-between;
    }

    /* Message jika error */
    .error-msg {
      color: #ef4444;
      text-align: center;
      font-size: 1.2rem;
      margin-top: 50px;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Area Informasi Klan -->
    <header id="clan-header" class="clan-header">
      <p>Memuat data klan...</p>
    </header>

    <!-- Area Daftar Anggota -->
    <main>
      <h2 class="section-title">Daftar Anggota</h2>
      <div id="member-grid" class="member-grid">
        <!-- Kartu anggota akan dimasukkan di sini via JS -->
      </div>
    </main>
  </div>

  <script>
    // URL file JSON lokal
    const jsonFile = 'members_latest.json';

    // Mengambil data dari JSON
    fetch(jsonFile)
      .then(response => {
        if (!response.ok) {
          throw new Error('Gagal mengambil file JSON');
        }
        return response.json();
      })
      .then(data => {
        renderClanHeader(data);
        renderMemberList(data.memberList);
      })
      .catch(error => {
        console.error('Error:', error);
        document.getElementById('clan-header').innerHTML = 
          `<p class="error-msg">Gagal memuat data. Pastikan file JSON berada di folder yang sama dan diakses via server (Live Server).</p>`;
      });

    // Fungsi menampilkan header klan
    function renderClanHeader(clan) {
      const headerEl = document.getElementById('clan-header');
      headerEl.innerHTML = `
        <img class="clan-badge" src="${clan.badgeUrls.medium}" alt="Logo Klan ${clan.name}">
        <div class="clan-info">
          <h1>${clan.name} <span style="font-size: 1rem; color: #94a3b8;">(${clan.tag})</span></h1>
          <div class="clan-meta">
            Level Klan: <strong>${clan.clanLevel}</strong> | 
            Anggota: <strong>${clan.members}/50</strong> | 
            Lokasi: <strong>${clan.location.name}</strong>
          </div>
          <p class="clan-description">"${clan.description}"</p>
        </div>
      `;
    }

    // Fungsi menampilkan daftar anggota
    function renderMemberList(members) {
      const gridEl = document.getElementById('member-grid');
      gridEl.innerHTML = ''; // bersihkan pesan loading

      members.forEach(member => {
        const card = document.createElement('div');
        card.className = `member-card ${member.role}`;

        card.innerHTML = `
          <div class="member-header">
            <span class="member-name">${member.name}</span>
            <span class="member-rank">#${member.clanRank}</span>
          </div>
          <div class="member-role">${formatRole(member.role)}</div>
          <div class="member-details">
            <div>🏛️ Town Hall: <strong>TH ${member.townHallLevel}</strong></div>
            <div>⭐ Exp Level: <strong>${member.expLevel}</strong></div>
            <div>🏆 Trofi: <strong>${member.trophies}</strong></div>
          </div>
          <div class="donations">
            <span>Diberikan: ${member.donations}</span>
            <span>Diterima: ${member.donationsReceived}</span>
          </div>
        `;

        gridEl.appendChild(card);
      });
    }

    // Fungsi pembantu untuk mempercantik penulisan Role
    function formatRole(role) {
      switch(role) {
        case 'leader': return '👑 Leader';
        case 'coLeader': return '🌟 Co-Leader';
        case 'admin': return '🛡️ Elder';
        default: return '⚔️ Member';
      }
    }
  </script>
</body>
</html>
