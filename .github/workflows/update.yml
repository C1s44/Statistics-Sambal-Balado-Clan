name: Auto Update CoC JSON Data

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Fetch Latest Data from CoC API
        env:
          COC_API_TOKEN: ${{ secrets.COC_API_TOKEN }}
        run: node fetch-coc.js

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add members_latest.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update CoC JSON data [skip ci]" && git push)
          
