name: Clash of Clans API CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout repository dari GitHub
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Setup environment Python
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    # 3. Cache dependencies agar build lebih cepat
    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    # 4. Install library yang dibutuhkan
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # 5. Jalankan script Python dengan Repository Secrets
    - name: Run CoC Script
      env:
        YOUR_API_TOKEN_HERE: ${{ secrets.COC_API_TOKEN }}
        CLAN_TAG: ${{ secrets.COC_CLAN_TAG }}
      run: |
        python app.py
        
